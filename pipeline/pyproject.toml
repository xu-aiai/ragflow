[project]
name = "xc975-pipeline"
version = "0.1.0"
description = "XC975-EV 随车助手第一批数据抽取管线（文档树 / 故障码 / 保养规则）"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5",
    "pydantic>=2",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
workbench = ["flask>=3", "pymupdf>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xc975_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
